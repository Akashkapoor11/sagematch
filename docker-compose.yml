name: sagematch

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sagematch
      POSTGRES_USER: sagematch
      POSTGRES_PASSWORD: sagematch
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sagematch -d sagematch"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  sagematch:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://sagematch:sagematch@db:5432/sagematch
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-18}
      MAX_PROBES: ${MAX_PROBES:-3}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
    ports:
      - "8080:8000"

volumes:
  postgres_data:
